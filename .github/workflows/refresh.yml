name: Refresh GitHub data

# Self-updating layer: pulls live repo data daily and commits it, which triggers a
# redeploy. No manual updates needed. Also runnable on demand.
on:
  schedule:
    - cron: "17 5 * * *" # daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub data
        env:
          # Set a fine-grained read-only PAT named PORTFOLIO_GH_TOKEN in repo secrets
          # to include private repos and raise the rate limit. Falls back to the
          # built-in token for public data.
          PORTFOLIO_GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN || github.token }}
        run: node scripts/fetch-github.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh GitHub data"
            git push
          fi
